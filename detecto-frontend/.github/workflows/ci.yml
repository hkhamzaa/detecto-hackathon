name: CI

# Every push and every pull request. The point of this file is that the
# verification below stops depending on anyone remembering to run it.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: it installs exactly what the lockfile says
      # and fails if the lockfile and package.json have drifted apart.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Typecheck and bundle. `build` runs `tsc -b` first, which covers the app,
      # the Vite config and the tests as three separate projects.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
